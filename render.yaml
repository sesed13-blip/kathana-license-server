services:
  - type: web
    name: kathana-license-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ADMIN_SECRET
        sync: false
    healthCheckPath: /health
